name: Päivitä ja julkaise

on:
  push:
    branches: [main]
  schedule:
    # 05.20 ja 15.20 Suomen talviaikaa (UTC+2)
    - cron: "20 3 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testit
        run: python -m unittest discover -s build/tests -v
      - name: Hae data ja rakenna
        run: python build/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
