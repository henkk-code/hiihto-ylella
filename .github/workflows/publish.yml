name: Päivitä ja julkaise

on:
  push:
    branches: [main]
  schedule:
    # 05.20 ja 15.20 Suomen talviaikaa (UTC+2)
    - cron: "20 3 * * *"
    - cron: "20 13 * * *"
    # 22.20: iltapäivitys vain MC/MM-kisapäivinä (pistetilanne ja tulokset)
    - cron: "20 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Kisapäivän tarkistus (vain iltapäivitys)
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "20 20 * * *" ]; then
            python build/raceday.py
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Testit
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s build/tests -v
      - name: Hae data ja rakenna
        if: steps.gate.outputs.run == 'true'
        run: python build/build.py
      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
