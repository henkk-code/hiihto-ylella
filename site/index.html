<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiihto Ylellä</title>
<meta name="description" content="Milloin Yle näyttää hiihtoa ja ampumahiihtoa: suorat lähetykset kellonaikoineen, maailmancup, Suomen cup, SM ja MM.">
<meta name="theme-color" content="#0b3b66" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1726" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3b66'/%3E%3Cpath d='M12 46 L52 30' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M14 52 L54 36' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='36' cy='16' r='5' fill='%237cc4ff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-2: #eef3f9;
  --text: #0f1f33;
  --muted: #5a6b80;
  --line: #dbe3ee;
  --accent: #0b5cad;
  --accent-soft: #e3effb;
  --live: #d6213f;
  --mc: #0b5cad; --sc: #1b8a5a; --sm: #8a5a00; --mm: #b0127a;
  --hiihto: #0b5cad; --ampumahiihto: #b85c00; --yhdistetty: #6b3fb5;
  --shadow: 0 1px 2px rgba(15,31,51,.06), 0 4px 16px rgba(15,31,51,.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1422;
    --surface: #121e30;
    --surface-2: #18273d;
    --text: #e6edf6;
    --muted: #93a4ba;
    --line: #23344d;
    --accent: #6cb4ff;
    --accent-soft: #16304f;
    --live: #ff5c74;
    --mc: #6cb4ff; --sc: #4fd197; --sm: #e5b45a; --mm: #f07acb;
    --hiihto: #6cb4ff; --ampumahiihto: #ffad5c; --yhdistetty: #b79bff;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
header.top { padding: 28px 0 8px; }
header.top h1 { margin: 0; font-size: 1.75rem; letter-spacing: -.02em; }
header.top p { margin: 4px 0 0; color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
.chip {
  appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; min-height: 36px;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); opacity: .35; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: var(--accent-soft); font-weight: 600; }
.chip[aria-pressed="true"] .dot { opacity: 1; }

.banner { margin: 12px 0; padding: 10px 14px; border-radius: 10px; background: #fff4d6; color: #5c4300; font-size: .9rem; }
@media (prefers-color-scheme: dark) { .banner { background: #3a2f10; color: #f3d98a; } }

section { margin-top: 28px; }
section > h2 { font-size: 1.05rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

.hero {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  border: 1px solid var(--line); padding: 18px 18px 8px; margin-top: 18px;
}
.hero h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.01em; }
.hero .answer { margin: 4px 0 10px; color: var(--muted); }
.hero .answer strong { color: var(--text); }
.hero.empty { padding-bottom: 18px; }

.day { margin: 14px 0 4px; font-weight: 700; font-size: .95rem; display: flex; align-items: baseline; gap: 8px; }
.day .rel { color: var(--muted); font-weight: 500; font-size: .85rem; }
.list { list-style: none; margin: 0; padding: 0; }
.bc {
  display: grid; grid-template-columns: 92px 1fr; gap: 2px 12px; padding: 10px 0;
  border-top: 1px solid var(--line);
}
.list .bc:first-child { border-top: 0; }
.bc .time { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.bc .time small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.bc .main { min-width: 0; }
.bc .title { font-weight: 600; overflow-wrap: anywhere; }
.bc .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: .85rem; margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 5px; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.ch { font-weight: 700; color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .78rem; }
a.ch:hover { border-color: var(--accent); }
.now { color: var(--live); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.now::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .now::before { animation: none; } }
.bc.is-now { background: linear-gradient(90deg, color-mix(in srgb, var(--live) 8%, transparent), transparent 70%); margin: 0 -18px; padding-left: 18px; padding-right: 18px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 4px 18px; }

.events { list-style: none; padding: 0; margin: 0; }
.ev { border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev > details > summary, .ev > .row { list-style: none; cursor: pointer; padding: 12px 0; display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; }
.ev > .row { cursor: default; }
.ev summary::-webkit-details-marker { display: none; }
.ev .dates { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .92rem; }
.ev .place { font-weight: 600; }
.ev .sub { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.type { font-size: .72rem; font-weight: 800; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; color: #fff; background: var(--t); }
@media (prefers-color-scheme: dark) { .type { color: #0b1422; } }
.end { display: inline-flex; align-items: center; gap: 8px; }
.chev { color: var(--muted); transition: transform .15s; width: 10px; display: inline-block; font-size: 1.2rem; line-height: 1; }
details[open] .chev { transform: rotate(90deg); }
.ev.past { opacity: .55; }
.ev.not-yle { color: var(--muted); }
.ev.not-yle .place, .ev.not-yle .dates { font-weight: 500; }
.ev.not-yle .type { background: transparent; color: var(--muted); border: 1px dashed var(--muted); padding: 1px 6px; }
.ev.not-yle .tag::before { background: var(--muted); opacity: .6; }
.noyle { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.legend { color: var(--muted); font-size: .85rem; margin: -4px 0 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.legend .sw { display: inline-block; width: 26px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.legend .sw.yle { background: var(--mc); }
.legend .sw.other { border: 1px dashed var(--muted); }
.ev.ongoing .dates { color: var(--live); }
.races { padding: 0 0 12px 104px; font-size: .9rem; }
.races h4 { margin: 8px 0 2px; font-size: .85rem; color: var(--muted); }
.races ul { margin: 0; padding: 0; list-style: none; }
.races li { padding: 2px 0; }
.races .g { display: inline-block; min-width: 2.6em; font-weight: 700; }
.races .disc { color: var(--muted); font-size: .8rem; }
.note { color: var(--muted); font-size: .85rem; margin: 4px 0 8px; }
.more { appearance: none; background: none; border: 0; color: var(--accent); font: inherit; font-size: .9rem; padding: 10px 0; cursor: pointer; }

footer { margin-top: 36px; color: var(--muted); font-size: .85rem; }
footer p { margin: 6px 0; }

@media (max-width: 480px) {
  .bc { grid-template-columns: 74px 1fr; }
  .ev > details > summary, .ev > .row { grid-template-columns: 74px 1fr auto; }
  .races { padding-left: 0; }
  header.top h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Hiihto Ylellä</h1>
    <p>Ylen suorat hiihtolähetykset kellonaikoineen – maailmancup, Suomen cup, SM ja MM.</p>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Lajit"></div>
  <div id="banner"></div>

  <div id="hero" class="hero" aria-live="polite"><p class="answer">Ladataan…</p></div>

  <section id="upcoming-sec" hidden>
    <h2>Tulevat lähetykset</h2>
    <div class="card" id="upcoming"></div>
  </section>

  <section>
    <h2 id="season-title">Kausi</h2>
    <p class="legend"><span><span class="sw yle"></span>Ylellä</span><span><span class="sw other"></span>Ei Ylellä – muut maailmancupin kisat (Viaplay)</span></p>
    <div class="card"><ul class="events" id="events"></ul></div>
    <button class="more" id="toggle-past" hidden></button>
  </section>

  <footer id="footer">
    <noscript><p>Sivu tarvitsee JavaScriptin.</p></noscript>
  </footer>
</div>

<script>
(() => {
  "use strict";
  const TZ = "Europe/Helsinki";
  const STORE_KEY = "hiihto-ylella:topics";
  const TYPE_LABEL = { MC: "Maailmancup", SC: "Suomen cup", SM: "SM-kisat", MM: "MM-kisat" };
  const SPORT_LABEL = { hiihto: "Hiihto", ampumahiihto: "Ampumahiihto" };
  const DISC_LABEL = { CC: "", NK: "yhdistetty" };

  const fmtDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const fmtTime = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
  const fmtWeekday = new Intl.DateTimeFormat("fi-FI", { timeZone: "UTC", weekday: "short" });
  const fmtWeekdayLong = new Intl.DateTimeFormat("fi-FI", { timeZone: "UTC", weekday: "long" });

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const dayKey = (d) => fmtDayKey.format(d);                     // YYYY-MM-DD Suomen aikaa
  const keyToUTC = (k) => new Date(k + "T12:00:00Z");
  const addDays = (k, n) => { const d = keyToUTC(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dm = (k) => { const [, m, d] = k.split("-"); return `${+d}.${+m}.`; };
  const weekday = (k) => cap(fmtWeekday.format(keyToUTC(k)).replace(".", ""));
  const dayLabel = (k) => `${weekday(k)} ${dm(k)}`;
  const time = (iso) => fmtTime.format(new Date(iso));
  const range = (a, b) => {
    if (a === b) return dm(a);
    const [ya, ma, da] = a.split("-").map(Number), [yb, mb, db] = b.split("-").map(Number);
    return (ya === yb && ma === mb) ? `${da}.–${db}.${mb}.` : `${da}.${ma}.–${db}.${mb}.`;
  };

  function splitTitle(t) {
    const i = t.indexOf(":");
    if (i > 0 && i < 40) return { pre: t.slice(0, i).trim(), main: t.slice(i + 1).trim() };
    return { pre: "", main: t };
  }

  let DATA = null;
  let active = new Set();
  let showPast = false;

  function loadActive(topics) {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (Array.isArray(saved)) {
        const valid = saved.filter((id) => topics.some((t) => t.id === id));
        if (valid.length) return new Set(valid);
      }
    } catch (_) { /* ei tallennusta */ }
    return new Set(topics.map((t) => t.id));
  }
  function saveActive() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...active])); } catch (_) { /* ohita */ }
  }

  function renderFilters() {
    const el = $("filters");
    el.innerHTML = DATA.topics.map((t) =>
      `<button class="chip" type="button" data-id="${esc(t.id)}" aria-pressed="${active.has(t.id)}" style="--c: var(--${esc(t.id)})"><span class="dot"></span>${esc(t.label)}</button>`
    ).join("");
    el.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.id;
      if (active.has(id)) { if (active.size > 1) active.delete(id); } else active.add(id);
      saveActive(); render();
    }));
  }

  const topicById = () => Object.fromEntries(DATA.topics.map((t) => [t.id, t]));
  const activeSports = () => new Set(DATA.topics.filter((t) => active.has(t.id)).map((t) => t.event_sport));
  const eventById = () => Object.fromEntries(DATA.events.map((e) => [e.id, e]));

  function bcItem(b, now, topics, events) {
    const { pre, main } = splitTitle(b.title);
    const isNow = new Date(b.start) <= now && now < new Date(b.end);
    const ev = b.event_id ? events[b.event_id] : null;
    const t = topics[b.topic];
    const ch = b.live_url
      ? `<a class="ch" href="${esc(b.live_url)}" target="_blank" rel="noopener" title="Katso Areenassa">${esc(b.channel.replace("Yle ", ""))}</a>`
      : `<span class="ch">${esc(b.channel.replace("Yle ", ""))}</span>`;
    const metaBits = [
      isNow ? `<span class="now">Nyt</span>` : "",
      ch,
      `<span class="tag" style="--c: var(--${esc(b.topic)})">${esc(t ? t.label : b.topic)}</span>`,
      ev ? `<span>${esc(ev.place)} · ${esc(TYPE_LABEL[ev.type] || ev.type)}</span>` : (pre ? `<span>${esc(pre)}</span>` : ""),
    ].filter(Boolean).join("");
    return `<li class="bc${isNow ? " is-now" : ""}">
      <div class="time">${time(b.start)}<small>–${time(b.end)}</small></div>
      <div class="main"><div class="title">${esc(main)}</div><div class="meta">${metaBits}</div></div>
    </li>`;
  }

  function groupByDay(list) {
    const groups = new Map();
    for (const b of list) {
      const k = dayKey(new Date(b.start));
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(b);
    }
    return groups;
  }

  function renderDays(list, now, todayKey) {
    const topics = topicById(), events = eventById();
    let html = "";
    for (const [k, items] of groupByDay(list)) {
      const rel = k === todayKey ? "tänään" : k === addDays(todayKey, 1) ? "huomenna" : "";
      html += `<div class="day">${esc(cap(fmtWeekdayLong.format(keyToUTC(k))))} ${dm(k)}${rel ? `<span class="rel">${rel}</span>` : ""}</div>`;
      html += `<ul class="list">${items.map((b) => bcItem(b, now, topics, events)).join("")}</ul>`;
    }
    return html;
  }

  function render() {
    renderFilters();
    const now = new Date();
    const todayKey = dayKey(now);
    const dow = keyToUTC(todayKey).getUTCDay();                // 0 = su
    const sundayKey = addDays(todayKey, (7 - dow) % 7);
    const isWeekend = dow === 0 || dow >= 5;
    const sports = activeSports();

    const visible = DATA.broadcasts
      .filter((b) => active.has(b.topic) && new Date(b.end) > now)
      .sort((a, b) => a.start.localeCompare(b.start));
    const inWindow = visible.filter((b) => dayKey(new Date(b.start)) <= sundayKey);
    const later = visible.filter((b) => dayKey(new Date(b.start)) > sundayKey);

    // --- Vastaus: tämä viikko / viikonloppu ---
    const hero = $("hero");
    const heading = isWeekend ? "Tänä viikonloppuna" : "Tällä viikolla ja viikonloppuna";
    const allEvs = DATA.events.filter((e) => sports.has(e.sport) && (e.broadcaster !== "other" || active.has("hiihto")));
    const evs = allEvs.filter((e) => e.broadcaster !== "other");
    const windowEvents = evs.filter((e) => e.end >= todayKey && e.start <= sundayKey);
    if (inWindow.length) {
      const names = [...new Set(inWindow.map((b) => b.event_id).filter(Boolean))]
        .map((id) => DATA.events.find((e) => e.id === id)).filter(Boolean)
        .map((e) => `${e.place} ${e.type}`);
      hero.className = "hero";
      hero.innerHTML = `<h2>${heading}: kyllä ✓</h2>
        <p class="answer"><strong>${inWindow.length} suoraa lähetystä</strong>${names.length ? " · " + esc(names.join(", ")) : ""}</p>
        ${renderDays(inWindow, now, todayKey)}`;
    } else {
      const nextB = later[0];
      const nextE = evs.find((e) => e.start > sundayKey);
      let nextTxt = "";
      if (nextB) nextTxt = `Seuraava lähetys: <strong>${esc(dayLabel(dayKey(new Date(nextB.start))))} klo ${time(nextB.start)}</strong> – ${esc(splitTitle(nextB.title).main)} (${esc(nextB.channel)})`;
      else if (nextE) nextTxt = `Seuraava tapahtuma: <strong>${esc(nextE.place)} ${esc(nextE.type)}</strong> ${range(nextE.start, nextE.end)}`;
      const pending = windowEvents.length
        ? `<p class="answer">Ohjelmassa ${esc(windowEvents.map((e) => e.place + " " + e.type).join(", "))}, mutta suoria TV-lähetyksiä ei löytynyt TV-oppaasta. Katso myös <a href="https://areena.yle.fi/tv/opas" target="_blank" rel="noopener">Areena</a>.</p>` : "";
      hero.className = "hero empty";
      hero.innerHTML = `<h2>${heading}: ei lähetyksiä</h2>${pending}<p class="answer">${nextTxt || "Ei tiedossa olevia tulevia lähetyksiä."}</p>`;
    }

    // --- Tulevat lähetykset ---
    $("upcoming-sec").hidden = later.length === 0;
    $("upcoming").innerHTML = later.length ? renderDays(later, now, todayKey) : "";

    // --- Kausi ---
    $("season-title").textContent = `Kausi ${DATA.season}`;
    const horizonKey = addDays(todayKey, DATA.horizon_days || 13);
    const bcCount = {};
    for (const b of DATA.broadcasts) if (b.event_id && active.has(b.topic)) bcCount[b.event_id] = (bcCount[b.event_id] || 0) + 1;
    const past = allEvs.filter((e) => e.end < todayKey);
    const rest = allEvs.filter((e) => e.end >= todayKey);
    const list = showPast ? [...past, ...rest] : rest;
    const showNK = active.has("yhdistetty"), showCC = active.has("hiihto");

    $("events").innerHTML = list.map((e) => {
      const yle = e.broadcaster !== "other";
      const status = (e.end < todayKey ? "past" : (e.start <= todayKey ? "ongoing" : "")) + (yle ? "" : " not-yle");
      const races = (e.races || []).filter((r) => (r.discipline === "NK" ? showNK : showCC));
      const n = bcCount[e.id] || 0;
      const sub = [
        `<span class="tag" style="--c: var(--${esc(e.sport)})">${esc(SPORT_LABEL[e.sport] || e.sport)}</span>`,
        yle ? "" : `<span class="noyle">Ei Ylellä</span>`,
        yle && status === "ongoing" ? `<span class="now">Käynnissä</span>` : "",
        !yle ? "" : n ? `<span>${n} lähetystä TV-oppaassa</span>` : (e.start > horizonKey ? `<span>lähetysajat n. 2 vk ennen</span>` : ""),
      ].filter(Boolean).join("");
      const head = `<div class="dates">${range(e.start, e.end)}</div>
        <div><div class="place">${esc(e.place)}</div><div class="sub">${sub}</div></div>
        <span class="end"><span class="type" style="--t: var(--${e.type.toLowerCase()})" title="${esc(TYPE_LABEL[e.type] || "")}">${esc(e.type)}</span>CHEV</span>`;
      if (!races.length && !e.note) return `<li class="ev ${status}"><div class="row">${head.replace("CHEV", `<span class="chev" aria-hidden="true"></span>`)}</div></li>`;
      const byDay = new Map();
      for (const r of races) { if (!byDay.has(r.date)) byDay.set(r.date, []); byDay.get(r.date).push(r); }
      const body = [...byDay].map(([d, rs]) => `<h4>${esc(dayLabel(d))}</h4><ul>${rs.map((r) =>
        `<li><span class="g">${esc(r.gender)}</span> ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name_fi)}</a>` : esc(r.name_fi)}${DISC_LABEL[r.discipline] ? ` <span class="disc">${DISC_LABEL[r.discipline]}</span>` : ""}</li>`
      ).join("")}</ul>`).join("");
      return `<li class="ev ${status}"><details><summary>${head.replace("CHEV", `<span class="chev" aria-hidden="true">›</span>`)}</summary>
        <div class="races">${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}${body}<p class="note">Kisaohjelma: FIS.${yle ? " Kellonajat näkyvät yllä, kun Yle julkaisee lähetykset." : ""}</p></div></details></li>`;
    }).join("") || `<li class="ev"><div class="row"><div></div><div>Ei tapahtumia valituilla lajeilla.</div><div></div></div></li>`;

    const tp = $("toggle-past");
    tp.hidden = past.length === 0;
    tp.textContent = showPast ? "Piilota menneet tapahtumat" : `Näytä menneet tapahtumat (${past.length})`;

    renderStatus();
  }

  function renderStatus() {
    const s = DATA.status || {};
    const gen = new Date(DATA.generated);
    const genTxt = `${dayLabel(dayKey(gen))} klo ${time(DATA.generated)}`;
    const warn = [];
    if (s.telkku && !s.telkku.ok) warn.push(`Lähetysajat eivät päivittyneet viimeisimmässä haussa${s.telkku.updated ? ` (viimeksi ${esc(dayLabel(dayKey(new Date(s.telkku.updated))))})` : ""}.`);
    if (s.fis && !s.fis.ok) warn.push("FIS-kisaohjelma ei päivittynyt viimeisimmässä haussa.");
    if (Date.now() - gen.getTime() > 36 * 3600 * 1000) warn.push(`Tiedot on päivitetty viimeksi ${genTxt}.`);
    $("banner").innerHTML = warn.length ? `<div class="banner">${warn.join(" ")}</div>` : "";
    $("footer").innerHTML = `
      <p>Päivitetty ${genTxt}. Lähetysajat noin kaksi viikkoa eteenpäin; vain suorat lähetykset Ylen TV-kanavilla.
      Pelkästään Areenassa näytettävät lähetykset eivät näy TV-oppaassa – tarkista myös <a href="https://areena.yle.fi/tv/opas" target="_blank" rel="noopener">Areenan opas</a>.</p>
      <p>Lähteet: <a href="${esc(DATA.source.url)}" target="_blank" rel="noopener">${esc(DATA.source.name)}</a> (tapahtumat) ·
      <a href="https://www.fis-ski.com/DB/cross-country/calendar-results.html" target="_blank" rel="noopener">FIS</a> (kisaohjelma) ·
      <a href="https://www.telkku.com/" target="_blank" rel="noopener">Telkku.com</a> (lähetysajat).
      Epävirallinen harrastesivu, ei Ylen palvelu.</p>`;
  }

  $("toggle-past").addEventListener("click", () => { showPast = !showPast; render(); });

  fetch("data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => {
      DATA = d;
      active = loadActive(d.topics);
      render();
      setInterval(render, 60 * 1000);   // "Nyt"-merkinnät ja menneiden piilotus ajan tasalle
    })
    .catch((err) => {
      $("hero").innerHTML = `<h2>Tietoja ei saatu ladattua</h2><p class="answer">Yritä hetken päästä uudelleen. (${esc(err.message)})</p>`;
    });
})();
</script>
</body>
</html>
