<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiihto Ylellä</title>
<meta name="description" content="Milloin Yle näyttää hiihtoa ja ampumahiihtoa: suorat lähetykset kellonaikoineen, maailmancup, Suomen cup, SM ja MM.">
<meta name="theme-color" content="#FFFFFF" id="theme-color">
<script>try{var t=localStorage.getItem("hiihto-ylella:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23D9480F'/%3E%3Cpath d='M12 44 L52 26' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M12 54 L52 36' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F2F2EE;
  --box: #FFFFFF;
  --box-2: #F7F7F4;
  --hover: #F3F3EF;
  --border: #D8D8D1;
  --border-muted: #E7E7E1;
  --text: #1F2328;
  --muted: #59636E;
  --faint: #818B98;
  --counter: rgba(31, 35, 40, .08);
  --accent: #D9480F;
  --accent-dark: #A8360A;
  --accent-text: #C2410C;
  --on-accent: #FFFFFF;
  --green: #1A7F37;  --green-bg: #DAFBE1;
  --red: #CF222E;    --red-bg: #FFF1F0;
  --ski: #0969DA;    --ski-bg: #DDF4FF;
  --bia: #9A6700;    --bia-bg: #FFF5C2;
  --nk: #127A7F;     --nk-bg: #D5F4F2;
  --lead: #7D4E00;   --lead-bg: #FFF8C5;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151513; --box: #1C1C1A; --box-2: #222220; --hover: #252523;
    --border: #36362F; --border-muted: #2B2B27;
    --text: #E6E6E1; --muted: #A3A39B; --faint: #77776F; --counter: rgba(230, 230, 225, .1);
    --accent-dark: #8F2E08; --accent-text: #F0763F;
    --green: #3FB950; --green-bg: rgba(46, 160, 67, .16);
    --red: #F85149;   --red-bg: rgba(248, 81, 73, .1);
    --ski: #58A6FF;   --ski-bg: rgba(56, 139, 253, .16);
    --bia: #D9A53A;   --bia-bg: rgba(187, 128, 9, .2);
    --nk: #3CCFC4;    --nk-bg: rgba(57, 197, 187, .15);
    --lead: #E3B341;  --lead-bg: rgba(210, 153, 34, .18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151513; --box: #1C1C1A; --box-2: #222220; --hover: #252523;
  --border: #36362F; --border-muted: #2B2B27;
  --text: #E6E6E1; --muted: #A3A39B; --faint: #77776F; --counter: rgba(230, 230, 225, .1);
  --accent-dark: #8F2E08; --accent-text: #F0763F;
  --green: #3FB950; --green-bg: rgba(46, 160, 67, .16);
  --red: #F85149;   --red-bg: rgba(248, 81, 73, .1);
  --ski: #58A6FF;   --ski-bg: rgba(56, 139, 253, .16);
  --bia: #D9A53A;   --bia-bg: rgba(187, 128, 9, .2);
  --nk: #3CCFC4;    --nk-bg: rgba(57, 197, 187, .15);
  --lead: #E3B341;  --lead-bg: rgba(210, 153, 34, .18);
  color-scheme: dark;
}
.s-hiihto { --c: var(--ski); --cbg: var(--ski-bg); }
.s-ampumahiihto { --c: var(--bia); --cbg: var(--bia-bg); }
.s-yhdistetty { --c: var(--nk); --cbg: var(--nk-bg); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/22px var(--sans); font-variant-numeric: tabular-nums; }
a { color: var(--ski); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 599px) { .wrap { padding: 0 12px; } }
.ico { width: 14px; height: 14px; flex: none; vertical-align: -2px; }

/* --- Yläpalkki --- */
.top { background: var(--box); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; min-height: 60px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--accent); }
.logo svg { width: 18px; height: 18px; }
.controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); background: var(--box);
  border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
}
.chip .em { filter: grayscale(1); opacity: .55; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { color: var(--text); background: var(--cbg); border-color: color-mix(in srgb, var(--c) 45%, transparent); font-weight: 600; }
.chip[aria-pressed="true"] .em { filter: none; opacity: 1; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; flex: none;
  color: var(--muted); background: var(--box); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
}
.icon-btn:hover { color: var(--text); background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; }
@media (max-width: 679px) {
  .controls { margin-left: 0; width: 100%; justify-content: space-between; align-items: flex-start; }
}

/* --- Laatikot (GitHub Box) --- */
.box { background: var(--box); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.box-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 10px 16px; background: var(--box-2); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.box-head .grow { flex: 1; }
.grp { display: flex; align-items: baseline; gap: 8px; padding: 8px 16px; background: var(--box-2); border-top: 1px solid var(--border-muted); border-bottom: 1px solid var(--border-muted); font-size: 14px; }
.grp:first-child { border-top: 0; }
.grp strong { font-weight: 700; }
.grp .cnt { margin-left: auto; color: var(--muted); font-size: 13px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li + li { border-top: 1px solid var(--border-muted); }

/* --- Pillerit --- */
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: 1px; }
.pill-sport { background: var(--cbg); color: var(--c); }
.pill-type { background: var(--counter); color: var(--muted); }
.pill-green { background: var(--green-bg); color: var(--green); }
.pill-gray { background: var(--counter); color: var(--muted); }
.pill-live { background: var(--red); color: #fff; letter-spacing: .03em; }
.pill-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill-live::before { animation: none; } }
.counter { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--counter); font-size: 12px; font-weight: 600; line-height: 18px; text-align: center; }

/* --- Napit --- */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 6px;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px;
  border: 1px solid var(--accent-dark); border-bottom-width: 3px;
}
.btn-primary:hover { text-decoration: none; filter: brightness(1.06); }
.btn-primary:active { border-bottom-width: 1px; margin-top: 2px; }
.btn-sm {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 6px;
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--box-2);
  border: 1px solid var(--border); white-space: nowrap; cursor: pointer;
}
.btn-sm:hover { background: var(--hover); text-decoration: none; border-color: var(--faint); }
.btn-sm .ico { width: 12px; height: 12px; color: var(--muted); }
span.btn-sm { cursor: default; color: var(--muted); }

/* --- Vastauslaatikko --- */
main.wrap { padding-top: 24px; }
.banner { margin-bottom: 16px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--bia) 40%, transparent); background: var(--bia-bg); border-radius: 6px; font-size: 14px; }
.hero-top { display: grid; grid-template-columns: 1fr 280px; }
.hero-main { padding: 20px 20px 18px; }
.hero-main h2 { margin-top: 10px; font-size: 24px; line-height: 31px; font-weight: 700; letter-spacing: -.015em; }
.hero-sub { margin-top: 8px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14px; }
.state { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.state.yes { background: var(--green-bg); color: var(--green); }
.state.no { background: var(--counter); color: var(--muted); }
.state .ico { width: 14px; height: 14px; }
.hero-next { padding: 20px; border-left: 1px solid var(--border-muted); background: var(--box-2); }
.hero-next .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.hero-next .when { margin-top: 6px; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.015em; }
.hero-next .count { margin-top: 2px; color: var(--accent-text); font-weight: 600; font-size: 14px; }
.hero-next .what { margin-top: 8px; font-size: 14px; color: var(--muted); }
.hero-next .what strong { color: var(--text); font-weight: 600; }
.hero-next .btn-primary { margin-top: 14px; }
.hero-list { border-top: 1px solid var(--border); }
.empty { padding: 14px 16px; color: var(--muted); font-size: 14px; }
@media (max-width: 679px) {
  .hero-top { grid-template-columns: 1fr; }
  .hero-next { border-left: 0; border-top: 1px solid var(--border-muted); }
  .hero-main h2 { font-size: 20px; line-height: 27px; }
  .hero-next .when { font-size: 22px; line-height: 28px; }
}

/* --- Lähetysrivi --- */
.bc { display: grid; grid-template-columns: 92px 1fr auto; gap: 0 14px; align-items: start; padding: 12px 16px; }
.bc .t { border-left: 3px solid var(--c); padding-left: 10px; line-height: 20px; }
.bc .t0 { display: block; font-weight: 600; font-size: 16px; }
.bc .t1 { display: block; color: var(--faint); font-size: 13px; }
.bc .title { font-weight: 600; overflow-wrap: anywhere; }
.bc .title .pill-live { margin-right: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 20px; }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.bc.is-live { background: var(--red-bg); }
.bc.is-live .t0 { color: var(--red); }
.nav-row:focus { outline: none; }
.nav-row:focus-visible { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
@media (max-width: 599px) {
  .bc { grid-template-columns: 66px 1fr auto; gap: 0 10px; padding: 12px; }
  .bc .t { padding-left: 8px; }
  .grp, .box-head { padding-left: 12px; padding-right: 12px; }
}

/* --- Välilehdet (GitHub UnderlineNav) --- */
.tabs { display: flex; gap: 4px; margin-top: 32px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 599px) { .tab { padding: 10px 8px; font-size: 14px; gap: 6px; } .tab .ico { display: none; } }
.tab {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: -1px;
  font: inherit; font-size: 15px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); border-bottom-color: var(--border); }
.tab[hidden] { display: none; }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.panel { margin-top: 16px; }

/* --- Kausi --- */
.ev-row {
  display: grid; grid-template-columns: 104px 1fr auto; gap: 0 14px; align-items: start; width: 100%;
  padding: 12px 16px; font: inherit; color: inherit; text-align: left; background: none; border: 0;
}
button.ev-row { cursor: pointer; }
button.ev-row:hover { background: var(--hover); }
.ev .d strong { display: block; font-weight: 600; }
.ev .d .wd { display: block; color: var(--faint); font-size: 13px; }
.ev .title { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.ev .r { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; padding-top: 1px; }
.ev .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .15s; }
.ev .ev-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ev.not-yle .d strong, .ev.not-yle .title { color: var(--muted); font-weight: 500; }
.ev.not-yle .pill-sport { background: var(--counter); color: var(--muted); }
.ev.past { opacity: .6; }
.detail { padding: 0 16px 14px 134px; font-size: 14px; line-height: 24px; }
.detail .dr { display: grid; grid-template-columns: 76px 22px 1fr; gap: 0 10px; }
.detail .when { color: var(--muted); font-weight: 600; }
.detail .g { color: var(--muted); font-weight: 600; }
.detail .disc { color: var(--muted); }
.detail .note { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
.detail .note.src { margin-top: 8px; }
@media (max-width: 599px) {
  .ev-row { grid-template-columns: 78px 1fr auto; gap: 0 10px; padding: 12px; }
  .ev .r .soon { display: none; }
  .detail { padding: 0 12px 14px 12px; }
}

/* --- Maailmancup --- */
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 679px) { .mc-grid { grid-template-columns: 1fr; } }
.box-head strong { color: var(--text); font-weight: 700; font-size: 14px; }
.box-head a { color: var(--muted); }
.sr { display: grid; grid-template-columns: 28px 1fr auto; gap: 0 10px; align-items: baseline; padding: 9px 16px; }
.sr .rk { font-weight: 600; color: var(--muted); text-align: right; }
.sr .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sr .nm a { color: var(--text); }
.sr .nat { margin-left: 6px; color: var(--muted); font-size: 13px; font-weight: 400; }
.sr .nat.home { color: var(--text); font-weight: 600; }
.sr .pt { font-weight: 600; text-align: right; white-space: nowrap; }
.sr .gap { display: block; color: var(--faint); font-size: 12px; font-weight: 400; line-height: 16px; }
.sr.lead { box-shadow: inset 3px 0 0 var(--c); }
.sr.lead .rk { color: var(--text); }
.pill-lead { margin-left: 6px; background: var(--lead-bg); color: var(--lead); }
.sep { padding: 4px 16px; background: var(--box-2); border-top: 1px solid var(--border-muted); border-bottom: 1px solid var(--border-muted); color: var(--muted); font-size: 12px; }
.mc-note { margin-top: 12px; color: var(--muted); font-size: 13px; }
.box-more { display: block; width: 100%; padding: 8px 16px; font: inherit; font-size: 13px; color: var(--muted); text-align: center; background: var(--box-2); border: 0; border-top: 1px solid var(--border-muted); cursor: pointer; }
.box-more:hover { color: var(--text); }
/* Hiihtäjäprofiili */
.sr .medals { display: block; margin-top: 1px; color: var(--muted); font-size: 12px; font-weight: 400; line-height: 18px; }
.sr .md { white-space: nowrap; }
.sr .md + .md { margin-left: 10px; }
.sr .md-l { margin-right: 4px; font-weight: 600; }
.sr.has-prof { cursor: pointer; }
.sr.has-prof:hover { background: var(--hover); }
.nm-btn { padding: 0; font: inherit; font-weight: 600; color: var(--text); text-align: left; background: none; border: 0; cursor: pointer; }
.nm-btn:hover { text-decoration: underline; }
.nm-btn .chev { width: 12px; height: 12px; margin-left: 3px; vertical-align: -1px; color: var(--faint); transition: transform .15s; }
.nm-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.rows > li.prof { border-top: 0; }
.prof { padding: 0 16px 14px 54px; font-size: 14px; line-height: 22px; }
.prof-meta { color: var(--muted); font-size: 13px; }
.prof-text { margin-top: 6px; }
.prof-src { color: var(--faint); font-size: 12px; white-space: nowrap; }
.prof-src a { color: var(--faint); }
.prof-stats { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.prof-stats strong { color: var(--text); font-size: 14px; font-weight: 600; }
.prof-h { margin-top: 12px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.pr { list-style: none; margin: 4px 0 0; padding: 0; }
.pr li { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 10px; font-size: 13px; line-height: 22px; }
.pr .d { color: var(--muted); }
.pr .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .what a { color: var(--text); }
.pr .rkk { font-weight: 600; text-align: right; white-space: nowrap; }
.pr .rkk.out { color: var(--faint); font-weight: 400; }
.prof-empty { margin-top: 4px; color: var(--muted); font-size: 13px; }
.prof-links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; }
@media (max-width: 599px) { .sr, .sep { padding-left: 12px; padding-right: 12px; } .prof { padding-left: 12px; padding-right: 12px; } }

/* --- Alalaita --- */
footer { margin-top: 40px; padding: 20px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; line-height: 20px; }
footer p + p { margin-top: 6px; }
footer .ok { color: var(--green); font-weight: 600; }
footer .err { color: var(--red); font-weight: 600; }
.text-btn { margin-top: 10px; padding: 0; font: inherit; font-size: 13px; color: var(--ski); background: none; border: 0; cursor: pointer; }
.text-btn:hover { text-decoration: underline; }
@media (hover: none) { .keys-btn { display: none; } }

dialog {
  width: min(380px, calc(100% - 32px)); padding: 0; color: var(--text); background: var(--box);
  border: 1px solid var(--border); border-radius: 6px;
}
dialog::backdrop { background: rgba(0, 0, 0, .4); }
dialog h2 { padding: 12px 16px; font-size: 14px; font-weight: 700; background: var(--box-2); border-bottom: 1px solid var(--border); }
dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; padding: 16px; font-size: 14px; }
dialog dd { margin: 0; color: var(--muted); }
kbd { display: inline-block; min-width: 22px; padding: 0 6px; font: 600 12px/20px var(--sans); text-align: center; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; background: var(--box-2); }
dialog form { padding: 0 16px 16px; text-align: right; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 15 L20 8"/><path d="M4 20 L20 13"/><circle cx="15" cy="4.5" r="1.6" fill="#fff" stroke="none"/></svg></span><h1 style="font-size:inherit">Hiihto Ylellä</h1></a>
    <div class="controls">
      <div class="chips" id="filters" role="group" aria-label="Lajit"></div>
      <button class="icon-btn" type="button" id="theme-btn"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <section class="box" id="hero" aria-live="polite">
    <div class="hero-top"><div class="hero-main"><p class="hero-sub">Ladataan…</p></div></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Näkymät">
    <button class="tab" role="tab" id="tab-bc" aria-controls="panel-bc" data-tab="lahetykset" aria-selected="true">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="3" width="13" height="9" rx="1.5"/><path d="M5.5 14.5h5"/></svg>
      Tulevat lähetykset <span class="counter" id="cnt-bc">0</span></button>
    <button class="tab" role="tab" id="tab-season" aria-controls="panel-season" data-tab="kausi" aria-selected="false">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5"/><path d="M1.5 6.5h13M5 1v3M11 1v3"/></svg>
      Kauden kisat <span class="counter" id="cnt-season">0</span></button>
    <button class="tab" role="tab" id="tab-mc" aria-controls="panel-mc" data-tab="maailmancup" aria-selected="false" hidden>
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 2h7v4a3.5 3.5 0 0 1-7 0V2zM8 9.5V12M5.5 14.5h5M4.5 3.5h-2a2 2 0 0 0 2 3M11.5 3.5h2a2 2 0 0 1-2 3"/></svg>
      Maailmancup <span class="counter" id="cnt-mc">0</span></button>
  </nav>

  <section class="panel" id="panel-bc" role="tabpanel" aria-labelledby="tab-bc"></section>
  <section class="panel" id="panel-season" role="tabpanel" aria-labelledby="tab-season" hidden>
    <div class="box">
      <div class="box-head">
        <span class="grow" id="season-head">Kausi</span>
        <button class="btn-sm" type="button" id="toggle-past" hidden></button>
      </div>
      <ul class="rows" id="events"></ul>
    </div>
  </section>

  <section class="panel" id="panel-mc" role="tabpanel" aria-labelledby="tab-mc" hidden></section>

  <footer id="footer"><noscript><p>Sivu tarvitsee JavaScriptin.</p></noscript></footer>
</main>

<dialog id="keys" aria-labelledby="keys-h">
  <h2 id="keys-h">Pikanäppäimet</h2>
  <dl>
    <dt><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dt><dd>Laji päälle / pois</dd>
    <dt><kbd>v</kbd></dt><dd>Vaihda välilehteä</dd>
    <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Seuraava / edellinen rivi</dd>
    <dt><kbd>Enter</kbd></dt><dd>Avaa kisat, Areena tai hiihtäjän tiedot</dd>
    <dt><kbd>m</kbd></dt><dd>Menneet kisat</dd>
    <dt><kbd>t</kbd></dt><dd>Vaalea / tumma teema</dd>
    <dt><kbd>?</kbd></dt><dd>Tämä ohje</dd>
  </dl>
  <form method="dialog"><button class="btn-sm">Sulje</button></form>
</dialog>

<script>
(() => {
  "use strict";
  const TZ = "Europe/Helsinki";
  const STORE_KEY = "hiihto-ylella:topics";
  const THEME_KEY = "hiihto-ylella:theme";
  const TYPE_LABEL = { MC: "Maailmancup", SC: "Suomen cup", SM: "SM-kisat", MM: "MM-kisat" };
  const SPORT_LABEL = { hiihto: "Hiihto", ampumahiihto: "Ampumahiihto" };
  const EMOJI = { hiihto: "🎿", ampumahiihto: "🎯", yhdistetty: "⛷️" };
  const PARTITIVE = { hiihto: "hiihtoa", ampumahiihto: "ampumahiihtoa", yhdistetty: "yhdistettyä" };
  const DISC_LABEL = { CC: "", NK: "yhdistetty" };

  const ICON = {
    pin: `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 14.5s5-4.3 5-8.2A5 5 0 0 0 3 6.3c0 3.9 5 8.2 5 8.2z"/><circle cx="8" cy="6.3" r="1.7"/></svg>`,
    tv: `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="3" width="13" height="9" rx="1.5"/><path d="M5.5 14.5h5"/></svg>`,
    clock: `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>`,
    play: `<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 2.8v10.4a.5.5 0 0 0 .77.42l8-5.2a.5.5 0 0 0 0-.84l-8-5.2a.5.5 0 0 0-.77.42z"/></svg>`,
    check: `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`,
    chev: `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>`,
    moon: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>`,
    sun: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>`,
  };

  const fmtDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const fmtTime = new Intl.DateTimeFormat("fi-FI", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
  const fmtWeekday = new Intl.DateTimeFormat("fi-FI", { timeZone: "UTC", weekday: "short" });
  const fmtWeekdayLong = new Intl.DateTimeFormat("fi-FI", { timeZone: "UTC", weekday: "long" });

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const dayKey = (d) => fmtDayKey.format(d);                     // YYYY-MM-DD Suomen aikaa
  const keyToUTC = (k) => new Date(k + "T12:00:00Z");
  const addDays = (k, n) => { const d = keyToUTC(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((keyToUTC(b) - keyToUTC(a)) / 864e5);
  const dm = (k) => { const [, m, d] = k.split("-"); return `${+d}.${+m}.`; };
  const wd = (k) => fmtWeekday.format(keyToUTC(k)).replace(".", "");
  const dayLabel = (k) => `${cap(wd(k))} ${dm(k)}`;
  const time = (iso) => fmtTime.format(new Date(iso));
  const range = (a, b) => {
    if (a === b) return dm(a);
    const [ya, ma, da] = a.split("-").map(Number), [yb, mb, db] = b.split("-").map(Number);
    return (ya === yb && ma === mb) ? `${da}.–${db}.${mb}.` : `${da}.${ma}.–${db}.${mb}.`;
  };
  const chName = (c) => c.replace("Yle ", "");
  const relDay = (todayKey, k) => {
    const d = daysBetween(todayKey, k);
    return d === 0 ? "tänään" : d === 1 ? "huomenna" : d === 2 ? "ylihuomenna" : d > 0 ? `${d} pv päästä` : "";
  };
  function countdown(iso, now) {
    const min = Math.round((new Date(iso) - now) / 60000);
    if (min <= 0) return "käynnissä nyt";
    if (min < 60) return `alkaa ${min} min päästä`;
    if (min < 24 * 60) { const h = Math.floor(min / 60), m = min % 60; return `alkaa ${h} h${m ? ` ${m} min` : ""} päästä`; }
    const d = daysBetween(dayKey(now), dayKey(new Date(iso)));
    return d === 1 ? "huomenna" : `${d} päivän päästä`;
  }

  function splitTitle(t) {
    const i = t.indexOf(":");
    if (i > 0 && i < 40) return { pre: t.slice(0, i).trim(), main: t.slice(i + 1).trim() };
    return { pre: "", main: t };
  }

  // --- Teema: tallennetaan vain, jos valinta poikkeaa laitteen asetuksesta ---
  const root = document.documentElement;
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const systemTheme = () => (mq.matches ? "dark" : "light");
  const effectiveTheme = () => root.dataset.theme || systemTheme();
  function updateThemeUI() {
    const dark = effectiveTheme() === "dark";
    const btn = $("theme-btn");
    btn.innerHTML = dark ? ICON.sun : ICON.moon;
    btn.setAttribute("aria-label", dark ? "Vaihda vaaleaan teemaan" : "Vaihda tummaan teemaan");
    btn.title = (dark ? "Vaalea teema" : "Tumma teema") + " (t)";
    $("theme-color").setAttribute("content", dark ? "#1C1C1A" : "#FFFFFF");
  }
  function toggleTheme() {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    if (next === systemTheme()) { delete root.dataset.theme; try { localStorage.removeItem(THEME_KEY); } catch (_) {} }
    else { root.dataset.theme = next; try { localStorage.setItem(THEME_KEY, next); } catch (_) {} }
    updateThemeUI();
  }
  $("theme-btn").addEventListener("click", toggleTheme);
  mq.addEventListener("change", updateThemeUI);
  updateThemeUI();

  // --- Välilehdet (URL-hash) ---
  const TABS = { lahetykset: ["tab-bc", "panel-bc"], kausi: ["tab-season", "panel-season"], maailmancup: ["tab-mc", "panel-mc"] };
  const tabFromHash = () => { const h = location.hash.slice(1); return TABS[h] ? h : "lahetykset"; };
  const tabVisible = (n) => !$(TABS[n][0]).hidden;
  let tab = tabFromHash();
  function showTab(name, push) {
    if (!tabVisible(name)) name = "lahetykset";
    tab = name;
    for (const [n, [t, p]] of Object.entries(TABS)) {
      $(t).setAttribute("aria-selected", n === name);
      $(t).tabIndex = n === name ? 0 : -1;
      $(p).hidden = n !== name;
    }
    if (push) history.replaceState(null, "", name === "lahetykset" ? location.pathname + location.search : "#" + name);
    const nav = document.querySelector(".tabs"), el = $(TABS[name][0]);   // kapealla näytöllä valittu välilehti näkyviin
    const r = el.getBoundingClientRect(), n = nav.getBoundingClientRect();
    if (r.right > n.right || r.left < n.left) nav.scrollLeft += r.left - n.left - 8;
  }
  function cycleTab(d) {
    const names = Object.keys(TABS).filter(tabVisible);
    return names[(names.indexOf(tab) + d + names.length) % names.length];
  }
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab, true)));
  window.addEventListener("hashchange", () => showTab(tabFromHash(), false));
  showTab(tab, false);

  // --- Tila ---
  let DATA = null;
  let active = new Set();
  let showPast = false;
  const openEvents = new Set();
  let openProfile = null;                 // avoinna olevan hiihtäjäprofiilin FIS-id
  const showTen = new Set();              // pistelistat, joissa näytetään sijat 6–10

  function loadActive(topics) {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (Array.isArray(saved)) {
        const valid = saved.filter((id) => topics.some((t) => t.id === id));
        if (valid.length) return new Set(valid);
      }
    } catch (_) { /* ei tallennusta */ }
    return new Set(topics.map((t) => t.id));
  }
  function saveActive() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify([...active])); } catch (_) { /* ohita */ }
  }

  function buildFilters() {
    $("filters").innerHTML = DATA.topics.map((t, i) =>
      `<button class="chip s-${esc(t.id)}" type="button" data-id="${esc(t.id)}" data-k="f:${esc(t.id)}" aria-pressed="false" title="${esc(t.label)} (${i + 1})"><span class="em" aria-hidden="true">${EMOJI[t.id] || "•"}</span>${esc(t.label)}</button>`
    ).join("");
    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-id]");
      if (b) toggleTopic(b.dataset.id);
    });
  }
  function toggleTopic(id) {
    if (active.has(id)) { if (active.size > 1) active.delete(id); } else active.add(id);
    saveActive(); render();
  }

  const topicById = () => Object.fromEntries(DATA.topics.map((t) => [t.id, t]));
  const activeSports = () => new Set(DATA.topics.filter((t) => active.has(t.id)).map((t) => t.event_sport));
  const eventById = () => Object.fromEntries(DATA.events.map((e) => [e.id, e]));
  // "hiihtoa" kun kaikki lajit valittuna, muuten valitut lajit: "ampumahiihtoa eikä yhdistettyä"
  function sportsPhrase() {
    const ids = DATA.topics.map((t) => t.id).filter((id) => active.has(id));
    if (ids.length === DATA.topics.length) return "hiihtoa";
    const words = ids.map((id) => PARTITIVE[id] || id);
    return words.length > 1 ? `${words.slice(0, -1).join(", ")} eikä ${words[words.length - 1]}` : words[0];
  }
  const sportPill = (id, label) => `<span class="pill pill-sport s-${esc(id)}">${EMOJI[id] || ""} ${esc(label)}</span>`;

  // --- Lähetykset ---
  function bcRow(b, now, topics, events) {
    const { pre, main } = splitTitle(b.title);
    const isNow = new Date(b.start) <= now && now < new Date(b.end);
    const ev = b.event_id ? events[b.event_id] : null;
    const t = topics[b.topic];
    const place = ev ? ev.place : pre;
    const ch = b.live_url
      ? `<a class="btn-sm" href="${esc(b.live_url)}" target="_blank" rel="noopener" title="Katso Areenassa" data-k="l:${esc(b.id)}">${ICON.play}${esc(chName(b.channel))}</a>`
      : `<span class="btn-sm">${ICON.tv}${esc(chName(b.channel))}</span>`;
    return `<li class="bc s-${esc(b.topic)} nav-row${isNow ? " is-live" : ""}" tabindex="-1" data-k="b:${esc(b.id)}">
      <div class="t"><span class="t0">${time(b.start)}</span><span class="t1">–${time(b.end)}</span></div>
      <div>
        <div class="title">${isNow ? `<span class="pill pill-live">LIVE</span>` : ""}${esc(main)}</div>
        <div class="meta">${sportPill(b.topic, t ? t.label : b.topic)}${place ? `<span>${ICON.pin}${esc(place)}</span>` : ""}${ev ? `<span>${esc(TYPE_LABEL[ev.type] || ev.type)}</span>` : ""}</div>
      </div>
      <div>${ch}</div>
    </li>`;
  }

  function dayGroups(list, now, todayKey) {
    const topics = topicById(), events = eventById();
    const groups = new Map();
    for (const b of list) {
      const k = dayKey(new Date(b.start));
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(b);
    }
    let html = "";
    for (const [k, items] of groups) {
      const rel = relDay(todayKey, k);
      html += `<div class="grp"><strong>${esc(cap(fmtWeekdayLong.format(keyToUTC(k))))} ${dm(k)}</strong>${rel ? `<span class="pill pill-gray">${rel}</span>` : ""}<span class="cnt">${items.length} ${items.length === 1 ? "lähetys" : "lähetystä"}</span></div>
        <ul class="rows">${items.map((b) => bcRow(b, now, topics, events)).join("")}</ul>`;
    }
    return html;
  }

  // --- Kausi ---
  function eventItems(list, todayKey, horizonKey, bcCount) {
    const showNK = active.has("yhdistetty"), showCC = active.has("hiihto");
    return list.map((e) => {
      const yle = e.broadcaster !== "other";
      const past = e.end < todayKey, ongoing = !past && e.start <= todayKey;
      const races = (e.races || []).filter((r) => (r.discipline === "NK" ? showNK : showCC));
      const n = bcCount[e.id] || 0;
      const expandable = races.length > 0 || !!e.note;
      const open = expandable && openEvents.has(e.id);
      const id = esc(e.id);
      const tv = !yle ? `<span>${ICON.tv}Ei Ylellä · Viaplay</span>`
        : n ? `<span>${ICON.tv}${n} ${n === 1 ? "lähetys" : "lähetystä"} Ylellä</span>`
        : (!past && e.start > horizonKey ? `<span>${ICON.clock}Lähetysajat n. 2 vk ennen</span>` : `<span>${ICON.tv}Ylellä</span>`);
      const status = yle && ongoing ? `<span class="pill pill-green">Käynnissä</span>` : "";
      const d = daysBetween(todayKey, e.start);
      const soon = !past && !ongoing && d <= 30 ? `<span class="soon">${relDay(todayKey, e.start)}</span>` : "";
      const cls = ["ev", past ? "past" : "", yle ? "" : "not-yle"].filter(Boolean).join(" ");
      const wds = e.start === e.end ? wd(e.start) : `${wd(e.start)}–${wd(e.end)}`;
      const inner = `<div class="d"><strong>${range(e.start, e.end)}</strong><span class="wd">${esc(wds)}</span></div>
        <div>
          <div class="title">${esc(e.place)} <span class="pill pill-type">${esc(TYPE_LABEL[e.type] || e.type)}</span>${status}</div>
          <div class="meta">${sportPill(e.sport, SPORT_LABEL[e.sport] || e.sport)}${tv}</div>
        </div>
        <div class="r">${soon}${expandable ? ICON.chev : `<span style="width:16px"></span>`}</div>`;
      if (!expandable) return `<li class="${cls}"><div class="ev-row nav-row" tabindex="-1" data-k="e:${id}">${inner}</div></li>`;
      const raceRows = races.map((r, i) => {
        const first = i === 0 || races[i - 1].date !== r.date;
        const name = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" data-k="r:${id}:${i}">${esc(r.name_fi)}</a>` : esc(r.name_fi);
        return `<div class="dr"><span class="when">${first ? esc(dayLabel(r.date)) : ""}</span><span class="g">${esc(r.gender)}</span><span>${name}${DISC_LABEL[r.discipline] ? ` <span class="disc">· ${DISC_LABEL[r.discipline]}</span>` : ""}</span></div>`;
      }).join("");
      return `<li class="${cls}">
        <button type="button" class="ev-row nav-row" data-toggle="${id}" data-k="e:${id}" aria-expanded="${open}" aria-controls="d-${id}">${inner}</button>
        <div class="detail" id="d-${id}"${open ? "" : " hidden"}>
          ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}${raceRows}
          <p class="note src">Kisaohjelma: FIS. M = miehet, N = naiset.${yle ? " Kellonajat näkyvät lähetyksissä, kun Yle julkaisee ne." : ""}</p>
        </div>
      </li>`;
    }).join("");
  }

  // --- Maailmancup ---
  const GENDER_LABEL = { M: "Miehet", N: "Naiset" };
  const SHOW_TOP = 5, MAX_TOP = 10, SEASON_ROWS = 6;
  const fmtPts = (n) => n.toLocaleString("fi-FI");
  const cidOf = (url) => { const m = /competitorid=(\d+)/.exec(url || ""); return m ? m[1] : null; };
  const seasonLabel = (code) => `${+code - 1}–${String(code).slice(2)}`;
  const MEDAL = ["🥇", "🥈", "🥉"];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  function medalLine(m) {
    if (!m) return "";
    const part = (label, long, x) => {
      if (!x || !(x.g + x.s + x.b)) return "";
      const title = `${long}: ${[plural(x.g, "kulta", "kultaa"), plural(x.s, "hopea", "hopeaa"), plural(x.b, "pronssi", "pronssia")].join(", ")}`;
      const items = [x.g, x.s, x.b].map((n, i) => n ? `${MEDAL[i]}${n}` : "").filter(Boolean).join(" ");
      return `<span class="md" title="${esc(title)}"><span class="md-l">${label}</span>${items}</span>`;
    };
    const html = part("Olympia", "Olympiamitalit", m.ol) + part("MM", "MM-mitalit", m.mm);
    return html ? `<span class="medals">${html}</span>` : "";
  }
  function ageOf(birth) {
    const [y, m, d] = birth.split("-").map(Number);
    const [ty, tm, td] = dayKey(new Date()).split("-").map(Number);
    return ty - y - (tm < m || (tm === m && td < d) ? 1 : 0);
  }
  function profileHtml(p, cid) {
    const meta = [p.birthdate ? `${ageOf(p.birthdate)} v` : "", p.club ? esc(p.club) : "",
      p.birthplace ? `synt. ${esc(p.birthplace)}` : ""].filter(Boolean).join(" · ");
    const text = p.extract
      ? `<p class="prof-text">${esc(p.extract)} <span class="prof-src">— <a href="${esc(p.wiki_url)}" target="_blank" rel="noopener">Wikipedia</a>, CC BY-SA</span></p>` : "";
    const c = p.career || {};
    const stats = p.career ? `<div class="prof-stats"><span><strong>${c.wins}</strong> ${c.wins === 1 ? "MC-voitto" : "MC-voittoa"}</span>
      <span><strong>${c.podiums}</strong> ${c.podiums === 1 ? "palkintosija" : "palkintosijaa"}</span><span>uralla, henkilökohtaiset</span></div>` : "";
    const season = p.season || [];
    const label = p.season_code ? seasonLabel(p.season_code) : DATA.season;
    const rk = (r) => typeof r.rank === "number"
      ? `<span class="rkk">${r.rank <= 3 ? MEDAL[r.rank - 1] + " " : ""}${r.rank}.</span>`
      : `<span class="rkk out">${esc(r.rank)}</span>`;
    const rows = season.slice(0, SEASON_ROWS).map((r) => `<li><span class="d">${dm(r.date)}</span>
      <span class="what"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.place)}</a> · ${esc(r.race)}</span>${rk(r)}</li>`).join("");
    const results = season.length
      ? `<div class="prof-h">Kausi ${esc(label)} · ${plural(season.length, "MC-kisa", "MC-kisaa")}</div><ol class="pr">${rows}</ol>`
      : `<div class="prof-h">Kausi ${esc(label)}</div><p class="prof-empty">Ei vielä maailmancupin kisoja tällä kaudella.</p>`;
    const more = season.length > SEASON_ROWS ? `<a href="${esc(p.fis_url)}" target="_blank" rel="noopener">Kaikki ${season.length} kisaa ↗</a>` : "";
    return `<li class="prof" id="p-${esc(cid)}">
      ${meta ? `<div class="prof-meta">${meta}</div>` : ""}${text}${stats}${results}
      <div class="prof-links"><a href="${esc(p.fis_url)}" target="_blank" rel="noopener">FIS-profiili ↗</a>${more}${p.wiki_url ? `<a href="${esc(p.wiki_url)}" target="_blank" rel="noopener">Wikipedia ↗</a>` : ""}</div>
    </li>`;
  }
  function standingsBox(s) {
    const t = topicById()[s.topic];
    const ten = s.rows.slice(0, MAX_TOP);
    const top = showTen.has(s.id) ? ten : ten.slice(0, SHOW_TOP);
    const home = top.some((r) => r.nation === "FIN") ? null : s.rows.find((r) => r.nation === "FIN");
    const lead = s.rows[0], second = s.rows[1];
    const row = (r) => {
      const isLead = r === lead;
      const gap = isLead ? (second ? `+${fmtPts(r.points - second.points)}` : "") : `−${fmtPts(lead.points - r.points)}`;
      const cid = s.topic === "hiihto" ? cidOf(r.url) : null;
      const p = cid ? (DATA.athletes || {})[cid] : null;
      const open = !!p && openProfile === cid;
      const name = p
        ? `<button type="button" class="nm-btn" data-prof="${esc(cid)}" data-k="pb:${esc(cid)}" aria-expanded="${open}" aria-controls="p-${esc(cid)}">${esc(r.name)}${ICON.chev}</button>`
        : r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : esc(r.name);
      return `<li class="sr nav-row${isLead ? " lead" : ""}${p ? " has-prof" : ""}" tabindex="-1" data-k="s:${esc(s.id)}:${r.rank}:${esc(r.name)}"${p ? ` data-row-prof="${esc(cid)}"` : ""}>
        <span class="rk">${r.rank}.</span>
        <span class="nm">${name}<span class="nat${r.nation === "FIN" ? " home" : ""}">${esc(r.nation)}</span>${isLead ? `<span class="pill pill-lead">Johtaa</span>` : ""}${p ? medalLine(p.medals) : ""}</span>
        <span class="pt">${fmtPts(r.points)} p${gap ? `<span class="gap">${gap}</span>` : ""}</span>
      </li>${open ? profileHtml(p, cid) : ""}`;
    };
    const moreBtn = ten.length > SHOW_TOP
      ? `<button type="button" class="box-more" data-more="${esc(s.id)}" data-k="more:${esc(s.id)}">${showTen.has(s.id) ? "Näytä vain kärkiviisikko" : `Näytä sijat ${SHOW_TOP + 1}–${ten.length}`}</button>` : "";
    return `<div class="box s-${esc(s.topic)}">
      <div class="box-head">${sportPill(s.topic, t ? t.label : s.topic)}<strong>${GENDER_LABEL[s.gender] || s.gender}</strong>
        <span class="grow"></span><span>${s.done}${s.total ? `/${s.total}` : ""} kisaa</span>
        <a href="${esc(s.url)}" target="_blank" rel="noopener" title="Koko pistetilanne: ${esc(s.source)}">${esc(s.source)} ↗</a></div>
      <ul class="rows">${top.map(row).join("")}</ul>
      ${home ? `<div class="sep">Paras suomalainen</div><ul class="rows">${row(home)}</ul>` : ""}
      ${moreBtn}
    </div>`;
  }
  function renderStandings() {
    const all = (DATA.standings || []).filter((s) => s.done > 0 && s.rows.length);
    $("tab-mc").hidden = all.length === 0;
    if (!all.length) { if (tab === "maailmancup") showTab("lahetykset", false); return; }
    if (tabFromHash() === "maailmancup" && tab !== "maailmancup") showTab("maailmancup", false);
    const shown = all.filter((s) => active.has(s.topic));
    $("cnt-mc").textContent = shown.length;
    const bia = shown.some((s) => s.source === "Wikipedia");
    $("panel-mc").innerHTML = shown.length
      ? `<div class="mc-grid">${shown.map(standingsBox).join("")}</div>
         <p class="mc-note">Kokonaispisteet. Lähteet: FIS (hiihto, yhdistetty)${bia ? " ja Wikipedia (ampumahiihto; vain kärkikymmenikkö, joten paras suomalainen näkyy vain sen sisällä)" : ""}.${shown.some((s) => s.topic === "hiihto") && Object.keys(DATA.athletes || {}).length ? " Hiihtäjän nimestä aukeavat tiedot: tulokset ja mitalit FIS, esittely Wikipedia." : ""}</p>`
      : `<div class="box"><p class="empty">Valituissa lajeissa ei ole vielä ajettu maailmancupin kisoja.</p></div>`;
  }

  function render() {
    const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    $("filters").querySelectorAll("button[data-id]").forEach((b) => b.setAttribute("aria-pressed", active.has(b.dataset.id)));

    const now = new Date();
    const todayKey = dayKey(now);
    const dow = keyToUTC(todayKey).getUTCDay();                // 0 = su
    const sundayKey = addDays(todayKey, (7 - dow) % 7);
    const isWeekend = dow === 0 || dow >= 5;
    const sports = activeSports();

    const visible = DATA.broadcasts
      .filter((b) => active.has(b.topic) && new Date(b.end) > now)
      .sort((a, b) => a.start.localeCompare(b.start));
    const inWindow = visible.filter((b) => dayKey(new Date(b.start)) <= sundayKey);
    const later = visible.filter((b) => dayKey(new Date(b.start)) > sundayKey);

    const allEvs = DATA.events.filter((e) => sports.has(e.sport) && (e.broadcaster !== "other" || active.has("hiihto")));
    const evs = allEvs.filter((e) => e.broadcaster !== "other");
    const windowEvents = evs.filter((e) => e.end >= todayKey && e.start <= sundayKey);

    // --- Vastauslaatikko ---
    const when = isWeekend ? "tänä viikonloppuna" : "tällä viikolla";
    const span = todayKey === sundayKey ? dayLabel(todayKey) : `${dayLabel(todayKey)}–${dayLabel(sundayKey)}`;
    const shownEvents = inWindow.length
      ? [...new Set(inWindow.map((b) => b.event_id).filter(Boolean))].map((id) => DATA.events.find((e) => e.id === id)).filter(Boolean)
      : windowEvents;
    const evPills = shownEvents.map((e) => `<span class="pill pill-sport s-${esc(e.sport)}">${EMOJI[e.sport] || ""} ${esc(e.place)} · ${esc(TYPE_LABEL[e.type] || e.type)}</span>`).join("");
    const n = inWindow.length;
    const headline = n
      ? `<span class="state yes">${ICON.check}Kyllä</span><h2>${n} ${n === 1 ? "suora lähetys" : "suoraa lähetystä"} Ylellä ${when}</h2>`
      : `<span class="state no">Ei lähetyksiä</span><h2>Yle ei näytä ${sportsPhrase()} ${when}</h2>`;
    const pending = !n && windowEvents.length
      ? `<p class="hero-sub">Kisat ovat ohjelmassa, mutta TV-oppaassa ei ole suoria lähetyksiä. Tarkista <a href="https://areena.yle.fi/tv/opas" target="_blank" rel="noopener">Areenan opas</a>.</p>` : "";

    const first = visible[0];
    const live = first && new Date(first.start) <= now ? first : null;
    let nextHtml;
    if (live) {
      nextHtml = `<div class="k">Nyt suorana</div>
        <div class="when">${esc(chName(live.channel))}</div>
        <div class="count">päättyy klo ${time(live.end)}</div>
        <div class="what"><strong>${esc(splitTitle(live.title).main)}</strong></div>
        ${live.live_url ? `<a class="btn-primary" href="${esc(live.live_url)}" target="_blank" rel="noopener" data-k="watch">${ICON.play}Katso Areenassa</a>` : ""}`;
    } else if (first) {
      const k = dayKey(new Date(first.start));
      const dayTxt = k === todayKey ? "Tänään" : k === addDays(todayKey, 1) ? "Huomenna" : dayLabel(k);
      nextHtml = `<div class="k">Seuraava lähetys</div>
        <div class="when">${esc(dayTxt)} ${time(first.start)}</div>
        <div class="count">${countdown(first.start, now)}</div>
        <div class="what"><strong>${esc(splitTitle(first.title).main)}</strong> · ${esc(first.channel)}</div>`;
    } else {
      const nextE = evs.find((e) => e.start > todayKey);
      nextHtml = nextE
        ? `<div class="k">Seuraava kisa</div><div class="when">${esc(nextE.place)}</div><div class="count">${relDay(todayKey, nextE.start)}</div><div class="what">${range(nextE.start, nextE.end)} · ${esc(TYPE_LABEL[nextE.type] || nextE.type)}</div>`
        : `<div class="k">Seuraava lähetys</div><div class="what">Ei tiedossa olevia lähetyksiä.</div>`;
    }
    $("hero").innerHTML = `<div class="hero-top">
        <div class="hero-main">${headline}
          <p class="hero-sub">${esc(span)}${evPills ? " " + evPills : ""}</p>${pending}
        </div>
        <div class="hero-next">${nextHtml}</div>
      </div>
      ${n ? `<div class="hero-list">${dayGroups(inWindow, now, todayKey)}</div>` : ""}`;

    // --- Tulevat lähetykset ---
    $("cnt-bc").textContent = later.length;
    $("panel-bc").innerHTML = `<div class="box">${later.length
      ? dayGroups(later, now, todayKey)
      : `<p class="empty">Ei muita tiedossa olevia lähetyksiä. Yle julkaisee lähetysajat noin kaksi viikkoa etukäteen – katso tulevat kisat <a href="#kausi">Kauden kisat</a> -välilehdeltä.</p>`}</div>`;

    // --- Kausi ---
    const horizonKey = addDays(todayKey, DATA.horizon_days || 13);
    const bcCount = {};
    for (const b of DATA.broadcasts) if (b.event_id && active.has(b.topic)) bcCount[b.event_id] = (bcCount[b.event_id] || 0) + 1;
    const past = allEvs.filter((e) => e.end < todayKey);
    const rest = allEvs.filter((e) => e.end >= todayKey);
    const list = showPast ? [...past, ...rest] : rest;
    $("cnt-season").textContent = rest.length;
    $("season-head").innerHTML = `Kausi ${esc(DATA.season)} · harmaat kisat eivät näy Ylellä`;
    $("events").innerHTML = eventItems(list, todayKey, horizonKey, bcCount) || `<li class="empty">Ei kisoja valituilla lajeilla.</li>`;
    const tp = $("toggle-past");
    tp.hidden = past.length === 0;
    tp.textContent = showPast ? "Piilota menneet" : `Näytä menneet (${past.length})`;

    renderStandings();
    renderStatus();

    if (focusKey) {
      const el = document.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
      if (el && el !== document.activeElement) el.focus({ preventScroll: true });
    }
  }

  function renderStatus() {
    const s = DATA.status || {};
    const gen = new Date(DATA.generated);
    const genTxt = `${dayLabel(dayKey(gen))} klo ${time(DATA.generated)}`;
    const st = (src) => !src ? "–" : src.ok ? `<span class="ok">ok</span>` : `<span class="err">ei päivittynyt</span>`;

    const warn = [];
    if (s.telkku && !s.telkku.ok) warn.push(`Lähetysajat eivät päivittyneet viimeisimmässä haussa${s.telkku.updated ? ` (viimeksi ${esc(dayLabel(dayKey(new Date(s.telkku.updated))))})` : ""}.`);
    if (s.fis && !s.fis.ok) warn.push("FIS-kisaohjelma ei päivittynyt viimeisimmässä haussa.");
    if (Date.now() - gen.getTime() > 36 * 3600 * 1000) warn.push(`Tiedot on päivitetty viimeksi ${esc(genTxt)}.`);
    $("banner").innerHTML = warn.length ? `<div class="banner" role="status">⚠️ ${warn.join(" ")}</div>` : "";

    $("footer").innerHTML = `
      <p>Päivitetty ${esc(genTxt)} · TV-opas ${st(s.telkku)} · FIS ${st(s.fis)} · pistetilanne ${st(s.standings)}${s.athletes ? ` · profiilit ${st(s.athletes)}` : ""}</p>
      <p>Vain suorat lähetykset Ylen TV-kanavilla, noin kaksi viikkoa eteenpäin. Pelkästään Areenassa näytettävät lähetykset eivät näy TV-oppaassa, joten tarkista myös <a href="https://areena.yle.fi/tv/opas" target="_blank" rel="noopener">Areenan opas</a>.</p>
      <p>Lähteet: <a href="${esc(DATA.source.url)}" target="_blank" rel="noopener">${esc(DATA.source.name)}</a> (kisat) ·
      <a href="https://www.fis-ski.com/DB/cross-country/calendar-results.html" target="_blank" rel="noopener">FIS</a> (kisaohjelma) ·
      <a href="https://www.telkku.com/" target="_blank" rel="noopener">Telkku.com</a> (lähetysajat) ·
      FIS ja Wikipedia (pistetilanne) · FIS, Wikidata ja Wikipedia (hiihtäjät). Epävirallinen harrastesivu, ei Ylen palvelu.</p>
      <button class="text-btn keys-btn" type="button" id="keys-btn" data-k="keys">⌨️ Pikanäppäimet (?)</button>`;
    $("keys-btn").addEventListener("click", openKeys);
  }

  // --- Toiminnot ---
  function openKeys() { const d = $("keys"); if (!d.open) d.showModal(); }
  function togglePast() { showPast = !showPast; render(); }
  function toggleEvent(id) { if (openEvents.has(id)) openEvents.delete(id); else openEvents.add(id); render(); }
  function toggleProfile(cid) { openProfile = openProfile === cid ? null : cid; render(); }
  function toggleTen(id) { if (showTen.has(id)) showTen.delete(id); else showTen.add(id); render(); }

  function moveRow(d) {
    const rows = [...document.querySelectorAll(".nav-row")].filter((el) => el.getClientRects().length > 0);
    if (!rows.length) return;
    const cur = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".nav-row") : null;
    let i = rows.indexOf(cur);
    i = i < 0 ? (d > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, i + d));
    rows[i].focus({ preventScroll: true });
    rows[i].scrollIntoView({ block: "nearest" });
  }

  $("toggle-past").addEventListener("click", togglePast);
  $("events").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const b = e.target.closest("button[data-toggle]");
    if (b) toggleEvent(b.dataset.toggle);
  });
  $("panel-mc").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const more = e.target.closest("button[data-more]");
    if (more) { toggleTen(more.dataset.more); return; }
    const row = e.target.closest("[data-row-prof]");
    if (row) {
      toggleProfile(row.dataset.rowProf);
      const b = document.querySelector(`button[data-prof="${CSS.escape(row.dataset.rowProf)}"]`);
      if (b) b.focus({ preventScroll: true });
    }
  });
  $("panel-bc").addEventListener("click", (e) => {
    if (e.target.closest('a[href="#kausi"]')) { e.preventDefault(); showTab("kausi", true); }
  });
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = cycleTab(e.key === "ArrowRight" ? 1 : -1);
    showTab(next, true); $(TABS[next][0]).focus(); e.preventDefault();
  });

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if ($("keys").open) return;                                 // dialogi hoitaa Escin itse
    const t = e.target;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    const k = e.key;
    if (k === "t") { toggleTheme(); e.preventDefault(); return; }
    if (k === "?") { openKeys(); e.preventDefault(); return; }
    if (k === "v") { showTab(cycleTab(1), true); e.preventDefault(); return; }
    if (!DATA) return;
    if (/^[1-9]$/.test(k)) {
      const topic = DATA.topics[+k - 1];
      if (topic) { toggleTopic(topic.id); e.preventDefault(); }
      return;
    }
    switch (k) {
      case "j": moveRow(1); break;
      case "k": moveRow(-1); break;
      case "m": if (tab !== "kausi") showTab("kausi", true); togglePast(); break;
      case "Enter": {
        if (!t.matches || !t.matches("li.nav-row")) return;
        if (t.dataset.rowProf) { toggleProfile(t.dataset.rowProf); break; }
        const a = t.querySelector("a");
        if (!a) return;
        a.click();
        break;
      }
      default: return;
    }
    e.preventDefault();
  });

  fetch("data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => {
      DATA = d;
      active = loadActive(d.topics);
      buildFilters();
      render();
      setInterval(render, 60 * 1000);   // LIVE-merkinnät, lähtölaskenta ja menneiden piilotus ajan tasalle
    })
    .catch((err) => {
      $("hero").innerHTML = `<div class="hero-main"><span class="state no">Virhe</span><h2>Tietoja ei saatu ladattua</h2><p class="hero-sub">Yritä hetken päästä uudelleen. (${esc(err.message)})</p></div>`;
    });
})();
</script>
</body>
</html>
